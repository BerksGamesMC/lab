<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#06152e">
<title>PlayStation Programmer Lab | Keşləmə</title>
<meta name="author" content="PlayStation Programmer Lab">
<link rel="stylesheet" href="./includes/css/colors/default.css">
<link rel="stylesheet" href="./includes/css/layouts/index.css">
<link rel="stylesheet" href="./includes/css/cache.css">
<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;color:#fff;background:#031027 url("./Arxa.png") center center/100% 100% no-repeat fixed}
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,rgba(0,112,255,.2),transparent 55%),linear-gradient(180deg,rgba(1,9,25,.42),rgba(1,10,29,.72))}
.mainContainer{position:relative;z-index:1;width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:105px 24px 85px}
.lab-brand{position:fixed;z-index:5;top:22px;right:24px;display:flex;align-items:center;gap:14px;padding:10px 13px 10px 20px;min-height:68px;border:1px solid rgba(91,190,255,.72);border-radius:17px;background:linear-gradient(135deg,rgba(5,28,65,.94),rgba(0,100,205,.62));box-shadow:0 0 24px rgba(0,137,255,.27),inset 0 0 18px rgba(65,177,255,.12);backdrop-filter:blur(12px)}
.lab-brand span{font-size:clamp(14px,1.55vw,20px);font-weight:800;letter-spacing:.5px;text-shadow:0 0 13px rgba(78,190,255,.55);white-space:nowrap}
.lab-brand img{width:48px;height:48px;object-fit:contain;border-radius:8px}
.cache-screen{width:min(760px,94vw);padding:clamp(28px,5vw,54px);text-align:center;border:1px solid rgba(91,190,255,.8);border-radius:25px;background:linear-gradient(145deg,rgba(4,22,53,.91),rgba(5,53,111,.78));box-shadow:0 22px 70px rgba(0,0,0,.48),0 0 36px rgba(0,132,255,.26),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(15px)}
.cache-title{margin-bottom:30px;color:#fff;font-size:clamp(21px,3vw,32px);line-height:1.25;font-weight:900;letter-spacing:1.4px;text-shadow:0 0 18px rgba(50,173,255,.55)}
.progress-bar-wrap{width:100%;height:19px;padding:3px;overflow:hidden;border:1px solid rgba(112,203,255,.65);border-radius:999px;background:rgba(0,7,23,.8);box-shadow:inset 0 2px 7px rgba(0,0,0,.55),0 0 18px rgba(0,132,255,.18)}
.progress-bar-fill{width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#0875ee,#28c7ff,#a2edff);box-shadow:0 0 17px rgba(48,190,255,.85);transition:width .35s ease}
.cache-subtitle{min-height:28px;margin-top:22px;color:#a9dcff;font-size:clamp(14px,1.7vw,18px);font-weight:650;overflow-wrap:anywhere}
.cache-footer{position:fixed;z-index:2;left:12px;bottom:10px;color:rgba(210,229,255,.24);font-size:9px;line-height:1.5;letter-spacing:.35px;pointer-events:none;user-select:none}
#cacheFrame{position:fixed;width:0;height:0;border:0;visibility:hidden}

/* v1.1 Yeniləmə Banneri (5 saniyəlik loading) */
#v11-update-banner{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:20000;width:min(540px,calc(100vw - 32px));padding:12px 16px;border-radius:16px;border:1px solid rgba(116,198,255,.85);background:linear-gradient(135deg,rgba(4,24,58,.96),rgba(6,78,158,.92));box-shadow:0 14px 36px rgba(0,0,0,.5),0 0 24px rgba(22,140,255,.35);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#f4f8ff;transition:opacity .45s ease,transform .45s ease}
#v11-update-banner.hide{opacity:0;transform:translate(-50%,-14px);pointer-events:none}
.v11-top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:700}
.v11-badge{display:inline-block;padding:2px 8px;border-radius:999px;background:rgba(112,189,255,.22);border:1px solid rgba(145,207,255,.6);color:#9ed8ff;font-size:12px;margin-right:6px}
#v11-close-btn{padding:4px 10px;font-size:12px;line-height:1.2;font-weight:700;color:#fff;background:linear-gradient(135deg,#168cff,#0754c7);border:1px solid rgba(128,198,255,.85);border-radius:8px;cursor:pointer}
.v11-progress-track{width:100%;height:6px;margin-top:10px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden}
#v11-progress-bar{width:100%;height:100%;border-radius:999px;background:linear-gradient(90deg,#48b2ff,#9be0ff);transform-origin:left center;transition:transform .1s linear}

@media(max-width:600px){.mainContainer{padding:112px 14px 70px}.lab-brand{top:12px;right:12px;min-height:54px;padding:7px 9px 7px 13px;gap:9px}.lab-brand img{width:38px;height:38px}.cache-screen{border-radius:19px}.cache-title{letter-spacing:.7px}#v11-update-banner{top:74px;width:calc(100vw - 20px);padding:10px 12px}.v11-top-row{font-size:12.5px}}
</style>
</head>
<body class="bg-gray-900 text-white">
<!-- v1.1 Yeniləmə Mesajı (5 saniyə) -->
<div id="v11-update-banner" role="status" aria-live="polite">
<div class="v11-top-row">
<div><span class="v11-badge">v1.1</span><span id="v11-status-text">v1.1 yeniləməsi yüklənir... (5s)</span></div>
<button type="button" id="v11-close-btn" onclick="dismissV11Banner()">Bağla</button>
</div>
<div class="v11-progress-track"><div id="v11-progress-bar"></div></div>
</div>

<header class="lab-brand"><span>PlayStation Programmer Lab</span><img src="./Lab.png" alt="Lab loqosu" onerror="this.style.display='none';"></header>
<main class="mainContainer">
<section class="cache-screen">
<div class="cache-title">FAYLLAR KÖÇÜRÜLÜR</div>
<div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill"></div></div>
<div class="cache-subtitle" id="cacheStatus">Hazırlanır...</div>
</section>
</main>
<div class="cache-footer">GoldHen : Sistro Dizayner : B7rks<br>2026 © PlayStation Programmer Lab</div>
<iframe id="cacheFrame" src="about:blank" title="Keşləmə çərçivəsi"></iframe>
<script src="./includes/js/storage.js"></script>
<script src="./includes/js/testMode.js"></script>
<script src="./includes/js/firmware.js"></script>
<script>
var fwVersion = getPs4FwVersion();
var targetPage = getCachePage(fwVersion);
var statusEl = document.getElementById('cacheStatus');
var fillEl = document.getElementById('progressFill');
var frame = document.getElementById('cacheFrame');

// iframe_cache.js faylından gələn mesajları dinlə
window.addEventListener('message', function(event) {
    var data = event.data;
    if (!data || !data.type) return;
    if (data.type === 'CACHE_PROGRESS') {
        if (data.percent >= 0) {
            fillEl.style.width = data.percent + '%';
            statusEl.textContent = 'Yüklənir... ' + data.percent + '%';
        } else {
            statusEl.textContent = 'Yüklənir... (' + data.loaded + ' / ' + data.total + ')';
        }
    } else if (data.type === 'CACHE_COMPLETE' || data.type === 'CACHE_EXISTS') {
        fillEl.style.width = '100%';
        statusEl.textContent = data.type === 'CACHE_EXISTS'
            ? 'Fayllar artıq keşlənib! Keçid edilir...'
            : 'Hazırdır! Keçid edilir...';
        setTimeout(function(){ window.location.replace(mainPage); }, 1000);
    } else if (data.type === 'CACHE_CHECKING') {
        statusEl.textContent = 'Keş yoxlanılır...';
    } else if (data.type === 'CACHE_DOWNLOADING') {
        statusEl.textContent = 'Fayllar keşə əlavə olunur...';
    } else if (data.type === 'CACHE_ERROR') {
        var reason = data.reason || 'Naməlum xəta';
        statusEl.textContent = 'Keş xətası: ' + reason;
        setTimeout(function(){ window.location.replace(mainPage); }, 3000);
    }
}, false);

// Firmware versiyasına uyğun keş səhifəsini gizli iframe-də aç
statusEl.textContent = (fwVersion || 'Naməlum') + ' proqram təminatı üçün keş başladılır...';
frame.src = targetPage;

// v1.1 5 saniyəlik yuxarı yeniləmə mesajı
(function () {
    var duration = 5000;
    var startTime = performance.now();
    var banner = document.getElementById('v11-update-banner');
    var bar = document.getElementById('v11-progress-bar');
    var v11Text = document.getElementById('v11-status-text');
    var timerId = null;

    window.dismissV11Banner = function () {
        if (timerId) cancelAnimationFrame(timerId);
        if (!banner || banner.classList.contains('hide')) return;
        banner.classList.add('hide');
        setTimeout(function () {
            if (banner && banner.parentNode) banner.parentNode.removeChild(banner);
        }, 480);
    };

    function tick(now) {
        var elapsed = now - startTime;
        var remaining = Math.max(0, duration - elapsed);
        var ratio = remaining / duration;

        if (bar) {
            bar.style.transform = 'scaleX(' + ratio.toFixed(4) + ')';
        }
        if (v11Text) {
            var secsLeft = Math.ceil(remaining / 1000);
            v11Text.textContent = 'v1.1 yeniləməsi yüklənir... (' + secsLeft + 's)';
        }

        if (remaining > 0) {
            timerId = requestAnimationFrame(tick);
        } else {
            if (v11Text) {
                v11Text.textContent = 'v1.1 hazırdır!';
            }
            setTimeout(window.dismissV11Banner, 120);
        }
    }

    timerId = requestAnimationFrame(tick);
})();
</script>
</body>
</html>
